<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小笼洛包</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/static/app-icon.png" />
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" href="/static/app-icon.png" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/app_lifecycle.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="title">小笼洛包</span>
    </div>
    <div class="status-bar" id="status-bar">
      <span class="badge" id="status-mode">模式 · 检测中…</span>
      <span class="badge" id="status-model">模型 · 检测中…</span>
      <span class="badge" id="status-tts">TTS · 检测中…</span>
      <span class="badge" id="status-whisper">Whisper · 检测中…</span>
    </div>
    <div class="mode-toggle" id="mode-toggle" title="问答模式：按键/文本触发；实时模式：连续聆听">
      <button class="btn mode-btn active" id="mode-qa" data-mode="qa">问答</button>
      <button class="btn mode-btn" id="mode-live" data-mode="live">实时</button>
    </div>
    <a class="btn ghost" id="btn-settings" href="/settings.html" title="设置（角色 / 插件 / 语音 / 记录）">设置</a>
  </header>

  <main class="layout">
    <!-- 聊天区 -->
    <section class="chat-pane">
      <!-- 状态胶囊（全局常驻）：浮在对话记录上方、标题栏下方靠左。
           持续性的状态（聆听 / 识别 / 生成回复 / 合成播报 / 多人对话 / 音乐 / 暂停）都显示在这里，
           不再往聊天记录里刷；一次性提示（清空上下文、跳过、出错等）仍然写进聊天记录，避免漏看。 -->
      <div class="status-capsule" id="status-capsule">
        <span class="cap-dot"></span><span class="cap-text" id="status-capsule-text">就绪</span>
      </div>
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-inner" id="chat">
          <div class="welcome">
            你好，我是你的语音助手。可以直接输入文字，或点击下方的麦克风按钮用语音对话。
          </div>
        </div>
      </div>

      <!-- 音乐播放条 -->
      <div class="music-bar hidden" id="music-bar">
        <div class="music-info">
          <span class="music-icon" aria-hidden="true"></span>
          <span class="music-title" id="music-title">音乐</span>
        </div>
        <!-- 可拖动进度条：点击 / 拖动跳转播放位置（样式与语音进度条一致） -->
        <div class="music-progress" id="music-progress" role="slider" tabindex="0"
             aria-label="播放进度（拖动跳转）" title="拖动跳转播放位置">
          <span class="music-track"><i id="music-progress-fill"></i></span>
          <b class="music-knob" id="music-progress-knob" aria-hidden="true"></b>
        </div>
        <span class="music-time" id="music-time">0:00 / 0:00</span>
        <div class="music-controls">
          <button class="btn icon" id="btn-music-toggle" title="播放/暂停"></button>
          <button class="btn icon" id="btn-music-stop" title="停止"></button>
        </div>
        <audio id="music-audio"></audio>
      </div>

      <div class="composer">
        <button class="btn icon mic" id="btn-mic" title="点击开始/停止录音"></button>
        <textarea id="input" rows="1" placeholder="输入消息，回车发送…"></textarea>
        <button class="btn icon" id="btn-stop-speech" title="停止播放语音"></button>
        <button class="btn icon" id="btn-clear" title="清空对话与上下文"></button>
        <button class="btn primary" id="btn-send">发送</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
